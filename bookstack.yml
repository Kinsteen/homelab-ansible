---
- name: Install Bookstack container
  hosts: bookstack
  roles:
    - name: Proxmox container setup
      role: proxmox
    - role: hifis.toolkit.unattended_upgrades
      unattended_origins_patterns:
        - 'origin=Debian,codename=${distro_codename},label=Debian-Security' # security updates

    - name: Install Bookstack with Docker compose
      role: docker
      vars:
        docker_compose_file_path: "/root/bookstack"
        docker_compose_content: |
          services:
            bookstack:
              image: lscr.io/linuxserver/bookstack:latest
              container_name: bookstack
              depends_on:
                mariadb:
                  condition: service_started
                  restart: true
              environment:
                - APP_URL=https://docs.francon.eu
                - APP_PROXIES=192.168.1.181/32,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22
                - DB_HOST=mariadb
                - DB_PORT=3306
                - AUTH_METHOD=oidc
                - OIDC_NAME=SSO
                - OIDC_CLIENT_ID={{ bookstack_oidc_client_id }}
                - OIDC_CLIENT_SECRET={{ bookstack_oidc_client_secret }}
                - OIDC_ISSUER=https://auth.francon.eu/application/o/bookstack/
                - OIDC_ISSUER_DISCOVER=true
                - OIDC_USER_TO_GROUPS=true
                - OIDC_GROUPS_CLAIM=groups
              volumes:
                - ./bookstack-config:/config
              ports:
                - 6875:80
              restart: unless-stopped
              env_file:
                - .env
            mariadb:
              image: lscr.io/linuxserver/mariadb:latest
              container_name: mariadb
              volumes:
                - ./mariadb-config:/config
              restart: unless-stopped
              env_file:
                - .env
        docker_compose_env: |
          TZ=Europe/Paris
          DB_DATABASE=bookstack
          DB_USERNAME=bookstack
          DB_PASSWORD='{{ bookstack_mariadb_password }}'
          MYSQL_DATABASE="${DB_DATABASE}"
          MYSQL_USER="${DB_USERNAME}"
          MYSQL_PASSWORD="${DB_PASSWORD}"
          MYSQL_ROOT_PASSWORD='{{ bookstack_mariadb_root_password }}'
          APP_KEY='{{ bookstack_app_key }}'

    - name: Install backup script
      role: backup
      vars:
        backup_name: bookstack
        backup_root: "/root/bookstack"
        backup_folders:
          - /root/bookstack/.env
          - /root/bookstack/bookstack-config/www/images
          - /root/bookstack/bookstack-config/www/themes
          - /root/bookstack/bookstack-config/www/uploads
          - /root/bookstack/database.sql
        backup_docker_mariadb:
          service: mariadb
          username: bookstack
          password: '{{ bookstack_mariadb_password }}'
          file: database.sql
        backup_restic_repositories:
          - name: backblaze
            repository_url: s3:https://s3.eu-central-003.backblazeb2.com/tassigny-bucket/bookstack
            repository_password: "{{ bookstack_restic_password }}"
            env:
              AWS_ACCESS_KEY_ID: "{{ bookstack_restic_aws_access_key_id }}"
              AWS_SECRET_ACCESS_KEY: "{{ bookstack_restic_aws_secret_access_key }}"
