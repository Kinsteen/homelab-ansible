---
- name: Install and setup Caddy.
  hosts: caddy
  tasks:
    - name: Ensure keyrings directory exists.
      ansible.builtin.file:
        path: "/etc/apt/keyrings"
        owner: "root"
        group: "root"
        mode: "0755"
        state: directory

    - name: Downloads Caddy keyring.
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /etc/apt/keyrings/caddy.asc
        owner: "root"
        group: "root"
        mode: "0644"

    - name: Add APT list file.
      ansible.builtin.deb822_repository:
        name: caddy
        types: deb
        uris: https://dl.cloudsmith.io/public/caddy/stable/deb/{{ ansible_distribution | lower }}
        suites: "any-version"
        components: main
        signed_by: /etc/apt/keyrings/caddy.asc

    - name: Ensure Caddy is installed.
      ansible.builtin.apt:
        update_cache: true
        package:
          - caddy

    - name: Create configuration
      ansible.builtin.template:
        dest: /etc/caddy/Caddyfile
        src: caddy/Caddyfile.j2
        mode: "644"
        owner: "root"
        group: "root"
      vars:
        auth:
          address: 192.168.1.156:9000
        sites:
          - service: authentik
            subdomain: auth
            ip: 192.168.1.156
            port: 9000
          - service: docs
            ip: 192.168.1.151
            port: 6875
          - service: drive
            ip: 192.168.1.230
            port: 80
            frame_options: SAMEORIGIN # Needed for Universal viewer
          - service: immich
            ip: 192.168.1.130
            port: 2283
          - service: mealie
            ip: 192.168.1.183
            port: 9925
          - service: jellyfin
            subdomain: media
            ip: 192.168.1.130
            port: 8096
            frame_options: SAMEORIGIN # Needed for Jellyfin-SSO
          - service: sonarr
            ip: 192.168.1.150
            port: 8989
            authentik_forward_auth: true
          - service: radarr
            ip: 192.168.1.150
            port: 7878
            authentik_forward_auth: true
          - service: prowlarr
            ip: 192.168.1.150
            port: 9696
            authentik_forward_auth: true
          - service: pelican
            subdomain: panel
            ip: 192.168.1.184
            port: 80
          - service: ptero-wing
            subdomain: wing2
            ip: 192.168.1.184
            internal_port: 8080
            external_port: 8080
            custom_rules_block: |
              import cors https://panel.francon.eu
          - service: nas
            ip: https://192.168.1.230
            port: 5668
            custom_rules_reverse_proxy: |
              transport http {
                tls_insecure_skip_verify
              }
          - service: vaultwarden
            subdomain: vault
            ip: 192.168.1.157
            port: 80
            custom_rules_block: |
              encode zstd gzip

              @admin {
                path /admin*
                not remote_ip private_ranges
              }
              redir @admin /
            frame_options: do-not-alter # Vaultwarden sets their own x-frame-options
          - service: vpn
            ip: 192.168.1.130
            port: 8123
          - service: uptimekuma
            subdomain: status
            ip: 192.168.1.158
            port: 3001

    - name: Ensure Caddy is reloaded.
      ansible.builtin.service:
        name: caddy
        state: reloaded
