---
- name: Ensure restic is installed
  ansible.builtin.package:
    name: restic
    state: present

- name: Copy .env file
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ backup_root }}/.env.{{ item.name }}"
    mode: "600"
    owner: root
    group: root
    trim_blocks: true
    lstrip_blocks: true
  loop: "{{ backup_restic_repositories }}"
  loop_control:
    label: "{{ item.name }}"

- name: Copy backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ backup_root }}/backup.sh"
    mode: "0700"
    owner: root
    group: root
    trim_blocks: true
    lstrip_blocks: true

- name: Setup systemd service
  ansible.builtin.systemd_service:
    name: backup
    daemon_reload: true

- name: Copy backup service
  ansible.builtin.template:
    src: backup.service.j2
    dest: "/etc/systemd/system/backup.service"
    mode: "0644"
    owner: root
    group: root
    trim_blocks: true
    lstrip_blocks: true

- name: Copy backup timer
  ansible.builtin.template:
    src: backup.timer.j2
    dest: "/etc/systemd/system/backup.timer"
    mode: "0644"
    owner: root
    group: root
    trim_blocks: true
    lstrip_blocks: true

- name: Setup systemd timer
  ansible.builtin.systemd_service:
    name: backup.timer
    daemon_reload: true
    enabled: true
    state: started

- name: Test backup script
  ansible.builtin.systemd_service:
    name: backup
    state: started
