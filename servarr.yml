- name: Servarr stack (prepare)
  hosts:
    - servarr
  tasks:
    - name: Ensure directory exists.
      ansible.builtin.file:
        path: "/root/qbittorrent"
        owner: "root"
        group: "root"
        mode: "0755"
        state: directory
    - name: Copy VPN wg0.conf
      ansible.builtin.copy:
        dest: "/root/qbittorrent/wg0.conf"
        mode: "0600"
        content: |
          [Interface]
          PrivateKey = {{ wg_private_key }}
          Address = 10.0.134.129/32, 2a0e:1c80:1337:1:10:0:134:129/128
          PostUp = DROUTE=$(ip route | grep default | awk '{print $3}'); HOMENET=192.168.0.0/16; HOMENET2=10.0.0.0/8; HOMENET3=172.16.0.0/12; ip route add $HOMENET3 via $DROUTE; ip route add $HOMENET2 via $DROUTE; ip route add $HOMENET via $DROUTE; iptables -I OUTPUT -d $HOMENET -j ACCEPT; iptables -A OUTPUT -d $HOMENET2 -j ACCEPT; iptables -A OUTPUT -d $HOMENET3 -j ACCEPT;  iptables -A OUTPUT ! -o %i -m mark ! --mark $(wg show %i fwmark) -m addrtype ! --dst-type LOCAL -j REJECT
          PreDown = HOMENET=192.168.0.0/16; HOMENET2=10.0.0.0/8; HOMENET3=172.16.0.0/12; ip route delete $HOMENET; ip route delete $HOMENET2; ip route delete $HOMENET3; iptables -D OUTPUT ! -o %i -m mark ! --mark $(wg show %i fwmark) -m addrtype ! --dst-type LOCAL -j REJECT; iptables -D OUTPUT -d $HOMENET -j ACCEPT; iptables -D OUTPUT -d $HOMENET2 -j ACCEPT; iptables -D OUTPUT -d $HOMENET3 -j ACCEPT
          DNS = 9.9.9.9, 1.1.1.1

          [Peer]
          PublicKey = s+vJxWBIZqSN6980ha0Nfk2EoMJa2j3FQ1NrSQERlE8=
          AllowedIPs = 0.0.0.0/0, ::/0
          Endpoint = fr-par.azirevpn.net:51820

- name: Servarr stack (docker)
  hosts:
    - servarr
  roles:
    - role: hifis.toolkit.unattended_upgrades
      unattended_origins_patterns:
        - 'origin=Debian,codename=${distro_codename},label=Debian-Security' # security updates

    - name: QBittorrent
      role: docker
      vars:
        docker_compose_file_path: "/root/qbittorrent"
        docker_compose_content: |
          services:
            wireguard:
              image: linuxserver/wireguard:latest
              dns:
                - 9.9.9.9
                - 1.1.1.1
              cap_add:
                - NET_ADMIN
                - SYS_MODULE
              sysctls:
                - net.ipv6.conf.all.disable_ipv6=0
                - net.ipv4.conf.all.src_valid_mark=1
              environment:
                - PUID=1000
                - PGID=1000
                - TZ=Europe/Paris
              ports:
                - 8080:8080
              volumes:
                - ./wg0.conf:/config/wg_confs/wg0.conf
                - /lib/modules:/lib/modules
              restart: always
            qbittorrent:
              image: lscr.io/linuxserver/qbittorrent:latest
              container_name: qbittorrent
              network_mode: "service:wireguard"
              depends_on:
                - wireguard
              environment:
                - PUID=1000
                - PGID=1000
                - TZ=Europe/Paris
                - WEBUI_PORT=8080
              volumes:
                - ./config:/config
                - /nas/Deluge Dl:/downloads #optional
              restart: unless-stopped
            qui:
              image: ghcr.io/autobrr/qui:latest
              container_name: qui
              volumes:
                - ./qui-config:/config
                - /nas/Deluge Dl:/downloads
              ports:
                - 7476:7476
              env_file:
                - .env
        docker_compose_env: |
          QUI__OIDC_ENABLED=true
          QUI__OIDC_ISSUER=https://auth.francon.eu/application/o/qui/
          QUI__OIDC_CLIENT_ID={{ qui_oidc_client_id }}
          QUI__OIDC_CLIENT_SECRET={{ qui_oidc_client_secret }}
          QUI__OIDC_REDIRECT_URL=https://torrent.francon.eu/api/auth/oidc/callback
          QUI__OIDC_DISABLE_BUILT_IN_LOGIN=true

    - name: Sonarr
      role: docker
      vars:
        docker_compose_file_path: "/root/sonarr"
        docker_compose_content: |
          services:
            sonarr:
              image: lscr.io/linuxserver/sonarr:latest
              container_name: sonarr
              environment:
                - PUID=1000
                - PGID=1000
                - TZ=Europe/Paris
              volumes:
                - ./config:/config
                - /nas:/nas
              ports:
                - 8989:8989
              restart: unless-stopped

    - name: Radarr
      role: docker
      vars:
        docker_compose_file_path: "/root/radarr"
        docker_compose_content: |
          services:
            radarr:
              image: lscr.io/linuxserver/radarr:latest
              container_name: radarr
              environment:
                - PUID=1000
                - PGID=1000
                - TZ=Europe/Paris
              volumes:
                - ./config:/config
                - /nas:/nas
              ports:
                - 7878:7878
              restart: unless-stopped

    - name: Prowlarr
      role: docker
      vars:
        docker_compose_file_path: "/root/prowlarr"
        docker_compose_content: |
          services:
            prowlarr:
              image: lscr.io/linuxserver/prowlarr:latest
              container_name: prowlarr
              environment:
                - PUID=1000
                - PGID=1000
                - TZ=Europe/Paris
              dns:
                - 9.9.9.9
                - 8.8.8.8
              volumes:
                - ./config:/config
                - ./mods:/custom-cont-init.d:ro
              ports:
                - 9696:9696
              restart: unless-stopped
